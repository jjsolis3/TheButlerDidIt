name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: butler
          POSTGRES_PASSWORD: butler
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U butler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Username=butler;Password=butler;Database=postgres
      E2E_DATABASE_URL: Host=localhost;Port=5432;Username=butler;Password=butler;Database=butler_e2e
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/web/package-lock.json
            tests/e2e/package-lock.json

      - name: Front end - install, type-check, lint, build
        working-directory: src/web
        run: |
          npm ci
          npx tsc -b
          npm run lint
          npm run build

      - name: .NET - build and test
        run: dotnet test --configuration Release

      - name: End-to-end - Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: "true"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            tests/e2e/screenshots/
            tests/e2e/test-results/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t butlerdidit:ci .
