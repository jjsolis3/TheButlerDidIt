name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: butler
          POSTGRES_PASSWORD: butler
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U butler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Username=butler;Password=butler;Database=postgres
      E2E_DATABASE_URL: Host=localhost;Port=5432;Username=butler;Password=butler;Database=butler_e2e
      # The multi-server test and the S3 media-store test (skipped when these aren't set).
      TEST_REDIS_URL: localhost:6379
      TEST_S3_URL: http://localhost:9000
      TEST_S3_ACCESS_KEY: test
      TEST_S3_SECRET_KEY: test
      # The Stripe adapter's tests (#101), against Stripe's own simulator.
      TEST_STRIPE_MOCK_URL: http://localhost:12111
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/web/package-lock.json
            tests/e2e/package-lock.json

      - name: Front end - install, type-check, lint, build
        working-directory: src/web
        run: |
          npm ci
          npx tsc -b
          npm run lint
          npm run build

      - name: S3 emulator for the media-store test
        run: |
          pipx install "moto[server]"
          nohup moto_server -p 9000 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/ > /dev/null && break; sleep 1; done

      # stripe-mock checks each request against Stripe's API definition. Pinned to the version whose API matches the
      # one Stripe.net pins; GitHub's runners come with Go.
      - name: Stripe simulator for the payment adapter's tests
        run: |
          go install github.com/stripe/stripe-mock@v0.206.0
          nohup "$(go env GOPATH)/bin/stripe-mock" -http-port 12111 -https-port 12112 > /tmp/stripe-mock.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -u sk_test_123: http://localhost:12111/v1/prices/price_123 > /dev/null && break; sleep 1; done

      - name: .NET - build and test
        run: dotnet test --configuration Release

      - name: End-to-end - Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: "true"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            tests/e2e/screenshots/
            tests/e2e/test-results/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t butlerdidit:ci .
      # Coolify's health check runs curl inside the container: without it every deploy is rolled back.
      - name: The image can run its health check
        run: docker run --rm --entrypoint curl butlerdidit:ci --version
      # The nightly backup restores each dump into a scratch database and checks it (#103). Prove both answers:
      # a real backup of a (tiny) database passes, and a truncated dump fails.
      - name: Build the backup image
        run: docker build -t butlerdidit-backup:ci deploy/backup
      - name: A backup passes its restore check, and a broken one fails it
        run: |
          docker network create backups
          docker run -d --name db --network backups -e POSTGRES_USER=butler -e POSTGRES_PASSWORD=butler -e POSTGRES_DB=butlerdidit postgres:16-alpine
          for i in $(seq 30); do docker exec db pg_isready -U butler -d butlerdidit && break; sleep 1; done
          docker exec db psql -U butler -d butlerdidit -v ON_ERROR_STOP=1 -c '
            CREATE TABLE "__EFMigrationsHistory" ("MigrationId" text, "ProductVersion" text);
            INSERT INTO "__EFMigrationsHistory" VALUES ($$20260101000000_Ci$$, $$10.0$$);
            CREATE TABLE "AspNetUsers" ("Id" text); INSERT INTO "AspNetUsers" VALUES ($$owner$$);
            CREATE TABLE "Scenarios" ("Id" text); INSERT INTO "Scenarios" VALUES ($$a-mystery$$);'
          mkdir backups
          backup() { docker run --rm --network backups -e POSTGRES_HOST=db -e POSTGRES_DB=butlerdidit -e POSTGRES_USER=butler -e POSTGRES_PASSWORD=butler -v "$PWD/backups:/backups" "$@"; }
          backup --entrypoint /backup.sh butlerdidit-backup:ci | tee backup.log
          grep -q "Backup restore check passed" backup.log
          head -c 300 backups/last/butlerdidit-latest.sql.gz > backups/broken.sql.gz
          if backup --entrypoint /hooks/50-check-restore butlerdidit-backup:ci check /backups/broken.sql.gz; then echo "A broken backup passed"; exit 1; fi
