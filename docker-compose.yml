# Production stack, deployed by Coolify (see docs/deploy-coolify.md).
#
# Coolify's built-in Traefik proxy terminates HTTPS for your domain and forwards
# traffic (including WebSockets) to the `app` service on port 8080. No ports are
# published on the host.
#
# Local run:  POSTGRES_PASSWORD=secret docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=butlerdidit;Username=butler;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      # Trust X-Forwarded-Proto/For from the reverse proxy so the app knows the
      # original request was HTTPS (secure cookies, correct QR code links).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Set to false after you create your host account to make the server invite-only.
      Auth__AllowRegistration: "${ALLOW_REGISTRATION:-true}"
      Auth__RequireConfirmedEmail: "${REQUIRE_CONFIRMED_EMAIL:-false}"
      # A new host's free trial of both games, in days (#100). Hosts from before plans keep both free.
      Plans__TrialDays: "${TRIAL_DAYS:-14}"
      # Optional email (password reset and sign-up confirmation). Links in emails use PUBLIC_URL.
      App__PublicUrl: "${PUBLIC_URL:-}"
      Email__Host: "${SMTP_HOST:-}"
      Email__Port: "${SMTP_PORT:-587}"
      Email__Username: "${SMTP_USERNAME:-}"
      Email__Password: "${SMTP_PASSWORD:-}"
      Email__From: "${SMTP_FROM:-}"
      # ---- AI game master (optional; see docs/ai-setup.md). You can also set all of
      # this up on the Admin -> AI page instead. Leave blank to skip.
      Ai__MonthlyBudgetUsd: "${AI_MONTHLY_BUDGET_USD:-25}"
      Ai__Providers__0__Name: "${AI_PROVIDER_NAME:-}"
      Ai__Providers__0__Kind: "${AI_PROVIDER_KIND:-}"          # Anthropic | OpenAI | Gemini | Ollama
      Ai__Providers__0__ApiKey: "${AI_PROVIDER_API_KEY:-}"
      Ai__Providers__0__BaseUrl: "${AI_PROVIDER_BASE_URL:-}"
      Ai__Roles__Storyteller__Provider: "${AI_PROVIDER_NAME:-}"
      Ai__Roles__Storyteller__Model: "${AI_STORYTELLER_MODEL:-}"
      Ai__Roles__Actor__Provider: "${AI_PROVIDER_NAME:-}"
      Ai__Roles__Actor__Model: "${AI_ACTOR_MODEL:-}"
      Ai__Roles__Inspector__Provider: "${AI_PROVIDER_NAME:-}"
      Ai__Roles__Inspector__Model: "${AI_INSPECTOR_MODEL:-}"
      # Optional second provider for voices and pictures (OpenAI, Gemini, ElevenLabs, Piper or StableDiffusion).
      Ai__Providers__1__Name: "${AI_MEDIA_PROVIDER_NAME:-}"
      Ai__Providers__1__Kind: "${AI_MEDIA_PROVIDER_KIND:-OpenAI}"
      Ai__Providers__1__ApiKey: "${AI_MEDIA_API_KEY:-}"
      Ai__Providers__1__BaseUrl: "${AI_MEDIA_BASE_URL:-}"
      Ai__Roles__Voice__Provider: "${AI_MEDIA_PROVIDER_NAME:-}"
      Ai__Roles__Voice__Model: "${AI_VOICE_MODEL:-}"
      Ai__Roles__Illustrator__Provider: "${AI_MEDIA_PROVIDER_NAME:-}"
      Ai__Roles__Illustrator__Model: "${AI_IMAGE_MODEL:-}"
      Ai__Roles__Filmmaker__Provider: "${AI_MEDIA_PROVIDER_NAME:-}"
      Ai__Roles__Filmmaker__Model: "${AI_VIDEO_MODEL:-}"   # optional, costs money: clips for escape room reveals
      # ---- Payments (optional; see "Payments with Stripe" in docs/deploy-coolify.md). Off until STRIPE_SECRET_KEY is set.
      Billing__Stripe__SecretKey: "${STRIPE_SECRET_KEY:-}"
      Billing__Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET:-}"
      Billing__Prices__MysteriesMonthly: "${STRIPE_PRICE_MYSTERIES_MONTHLY:-}"
      Billing__Prices__MysteriesYearly: "${STRIPE_PRICE_MYSTERIES_YEARLY:-}"
      Billing__Prices__EscapeRoomsMonthly: "${STRIPE_PRICE_ESCAPE_MONTHLY:-}"
      Billing__Prices__EscapeRoomsYearly: "${STRIPE_PRICE_ESCAPE_YEARLY:-}"
      Billing__Prices__BothMonthly: "${STRIPE_PRICE_BOTH_MONTHLY:-}"
      Billing__Prices__BothYearly: "${STRIPE_PRICE_BOTH_YEARLY:-}"
      Billing__Prices__MysteriesPass: "${STRIPE_PRICE_MYSTERIES_PASS:-}"
      Billing__Prices__EscapeRoomsPass: "${STRIPE_PRICE_ESCAPE_PASS:-}"
      Billing__Prices__BothPass: "${STRIPE_PRICE_BOTH_PASS:-}"
      Billing__PassHours: "${PASS_HOURS:-72}"
      Billing__GraceDays: "${PAYMENT_GRACE_DAYS:-7}"
      Billing__AutomaticTax: "${STRIPE_AUTOMATIC_TAX:-false}"
      # ---- Sign-up check (optional; Cloudflare Turnstile). Off until both keys are set.
      Turnstile__SiteKey: "${TURNSTILE_SITE_KEY:-}"
      Turnstile__SecretKey: "${TURNSTILE_SECRET_KEY:-}"
      # ---- Monitoring (optional; see "Monitoring" in docs/deploy-coolify.md). OpenTelemetry is off until the endpoint is set.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-butler-did-it}"
      Alerts__AiSpendMinUsd: "${ALERT_AI_SPEND_MIN_USD:-5}"
      Alerts__FailedPaymentsMin: "${ALERT_FAILED_PAYMENTS_MIN:-3}"
      Alerts__Email: "${ALERT_EMAIL:-}"
      # ---- Terms, privacy and refunds (see "Terms, privacy and refunds" in docs/deploy-coolify.md). Set before charging anyone.
      Legal__OperatorName: "${LEGAL_OPERATOR_NAME:-}"
      Legal__ContactEmail: "${LEGAL_CONTACT_EMAIL:-}"
      Legal__State: "${LEGAL_STATE:-}"
      Legal__RefundDays: "${REFUND_DAYS:-14}"
      Legal__HostingProvider: "${LEGAL_HOSTING_PROVIDER:-}"
      Legal__EmailProvider: "${LEGAL_EMAIL_PROVIDER:-}"
      Legal__StorageProvider: "${LEGAL_STORAGE_PROVIDER:-}"
      Legal__MonitoringProvider: "${LEGAL_MONITORING_PROVIDER:-}"
      # ---- More than one server (optional; see "Running more than one server" in docs/deploy-coolify.md).
      Scale__MultiInstance: "${SCALE_MULTI_INSTANCE:-false}"
      Scale__Redis: "${REDIS_URL:-}"
      DataProtection__Store: "${DATA_PROTECTION_STORE:-}"   # Database: share sign-in keys between servers
      Database__MigrateOnStartup: "${MIGRATE_ON_STARTUP:-true}"
      Media__Storage: "${MEDIA_STORAGE:-Local}"            # Local | S3
      Media__S3__ServiceUrl: "${S3_SERVICE_URL:-}"
      Media__S3__Region: "${S3_REGION:-auto}"
      Media__S3__Bucket: "${S3_BUCKET:-}"
      Media__S3__AccessKey: "${S3_ACCESS_KEY:-}"
      Media__S3__SecretKey: "${S3_SECRET_KEY:-}"
    volumes:
      - keys:/data/keys   # keeps hosts logged in across redeploys
      - media:/data/media # generated images and voices (milestone 3)
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: butlerdidit
      POSTGRES_USER: butler
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U butler -d butlerdidit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nightly database backups into the `backups` volume: 7 daily, 4 weekly and 6 monthly are kept,
  # older ones are deleted. After each one, it's restored into a scratch database and checked
  # (deploy/backup/check-restore). These stay on the same server, so also copy them somewhere else
  # (see "Data and backups" in docs/deploy-coolify.md, which also has the restore steps).
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: butlerdidit
      POSTGRES_USER: butler
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      SCHEDULE: "${BACKUP_SCHEDULE:-@daily}"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      # Optional: addresses to call when a backup passed its restore check, or failed (e.g. a Healthchecks.io
      # check, or an Uptime Kuma push monitor). "**None**" is the image's word for "not set".
      WEBHOOK_POST_BACKUP_URL: "${BACKUP_OK_URL:-**None**}"
      WEBHOOK_ERROR_URL: "${BACKUP_FAILED_URL:-**None**}"
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  keys:
  media:
  backups:
